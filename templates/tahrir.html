{% extends "base.html" %}
{% block title %}{{ tr('tahrirlash') }} | KURS.TOP{% endblock %}
{% block content %}

<header>
  <h1>{{ tr('tahrirlash') }}</h1>
  <p>{{ tr('tahrir_p') }}</p>
</header>

<section class="add">
  {% if xato %}<p class="xato">{{ xato }}</p>{% endif %}
  <form method="post" enctype="multipart/form-data">
    <input name="ism" value="{{ t.ism }}" placeholder="{{ tr('ph_ism') }}" required>
    <input name="fan" value="{{ t.fan }}" placeholder="{{ tr('ph_fan') }}" required>
    <input name="shahar" value="{{ t.shahar }}" placeholder="{{ tr('ph_shahar') }}" required>
    <input name="narx" value="{{ t.narx }}" placeholder="{{ tr('ph_narx') }}" required>
    <input name="telefon" value="{{ t.telefon or '' }}" placeholder="{{ tr('ph_tel') }}" required>
    <input name="telegram" value="{{ ('@' + t.telegram) if t.telegram else '' }}" placeholder="{{ tr('ph_tg') }}">
    <textarea name="tavsif" rows="4" maxlength="600" placeholder="{{ tr('ph_tavsif') }}">{{ t.tavsif or '' }}</textarea>
    <label class="chk"><input type="checkbox" name="bepul" value="1" {% if t.bepul_dars %}checked{% endif %}> {{ tr('bepul_lbl') }}</label>
    <label class="fayl">{% if t.rasm %}{{ tr('yangi_rasm') }}{% else %}{{ tr('rasm_kichik') }}{% endif %} {{ tr('rasm_format') }}
      <input type="file" name="rasm" accept="image/jpeg,image/png,image/webp">
    </label>
    <button>{{ tr('saqlash') }}</button>
  </form>
  <p><a href="/repetitor/{{ t.id }}">{{ tr('bekor') }}</a></p>
</section>

{% endblock %}
